---
stages:
  - syntax
  - unit

default:
  cache:
    paths:
      - vendor/bundle
  before_script: &before_script
    - bundle -v
    - rm -f Gemfile.lock
    - bundle install --without system_tests --path vendor/bundle --jobs "$(nproc)"

syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop:
  stage: syntax
  image: ruby:3.2.8
  script:
    - bundle exec rake syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop
  variables:
    PUPPET_GEM_VERSION: '~> 8.0'

.spec_template: &spec_template
  stage: unit
  script:
    - 'sed -i "s/ref: \"v9.7.0\"/ref: \"${STDLIB_REF}\"/" .fixtures.yml'
    - bundle exec rake spec

spec-puppet7-stdlib8:
  <<: *spec_template
  image: ruby:2.7.8
  variables:
    PUPPET_GEM_VERSION: '~> 7.0'
    STDLIB_REF: 'v8.6.0'

spec-puppet7-stdlib9:
  <<: *spec_template
  image: ruby:2.7.8
  variables:
    PUPPET_GEM_VERSION: '~> 7.0'
    STDLIB_REF: 'v9.7.0'

spec-puppet8-stdlib8:
  <<: *spec_template
  image: ruby:3.2.8
  variables:
    PUPPET_GEM_VERSION: '~> 8.0'
    STDLIB_REF: 'v8.6.0'

spec-puppet8-stdlib9:
  <<: *spec_template
  image: ruby:3.2.8
  variables:
    PUPPET_GEM_VERSION: '~> 8.0'
    STDLIB_REF: 'v9.7.0'
